name: CI

on:
  pull_request:

jobs:
  lint-frontend:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn lint && yarn format:check
        working-directory: frontend

  test-frontend:
    name: Unit tests (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: frontend
      - run: yarn test
        working-directory: frontend

  docker-build-frontend:
    name: Docker build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: backend
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: backend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend -d backend"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://backend:backend@localhost:5432/backend?schema=public
      BETTER_AUTH_SECRET: only-for-ci-testing
      BETTER_AUTH_URL: http://localhost:4321
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: frontend

      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: frontend

      - name: Seed database
        run: npx prisma db seed
        working-directory: frontend

      - name: Build frontend
        run: yarn build
        working-directory: frontend

      - name: Start frontend
        run: node ./dist/server/entry.mjs &
        working-directory: frontend
        env:
          PORT: 4321
          HOST: localhost

      - name: Wait for stack to be healthy
        run: timeout 60 bash -c 'until curl -sf http://localhost:4321; do sleep 3; done'

      - name: Run E2E tests
        run: yarn test:e2e
        working-directory: frontend
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
