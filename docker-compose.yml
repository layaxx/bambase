services:
  frontend_db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: bambase_frontend_db
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: backend
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
    volumes:
      - frontend_db_data:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend-migrate:
    build:
      context: ./frontend
    image: ghcr.io/layaxx/bambase-frontend:${IMAGE_TAG:-latest}
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://backend:backend@frontend_db:5432/backend?schema=public
    depends_on:
      frontend_db:
        condition: service_healthy
    networks:
      - internal_network
    restart: "no"

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/layaxx/bambase-frontend:${IMAGE_TAG:-latest}
    container_name: bambase_frontend
    environment:
      TZ: Europe/Berlin
      DATABASE_URL: postgresql://backend:backend@frontend_db:5432/backend?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${FRONTEND_URL}
    restart: unless-stopped
    depends_on:
      frontend-migrate:
        condition: service_completed_successfully
    networks:
      - proxy
      - internal_network

volumes:
  frontend_db_data:

networks:
  internal_network:
    name: internal_network
  proxy:
    name: proxy
    external: true
