services:
  frontend_db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: bambase_frontend_db
    environment:
      TZ: Europe/Berlin
      POSTGRES_DB: backend
      POSTGRES_USER: backend
      POSTGRES_PASSWORD: backend
    volumes:
      - frontend_db_data:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d backend"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off job: applies pending migrations and (if SEED=true) seeds sample
  # data, then exits. Uses the `builder` stage, which still has the full
  # source tree and the Prisma CLI (dropped from the slim runtime image).
  frontend-migrate:
    build:
      context: ./frontend
      target: builder
    environment:
      DATABASE_URL: postgresql://backend:backend@frontend_db:5432/backend?schema=public
      SEED: ${SEED:-false}
    command: >
      sh -c "npx prisma migrate deploy && if [ \"$$SEED\" = \"true\" ]; then npx prisma db seed; fi"
    depends_on:
      frontend_db:
        condition: service_healthy
    networks:
      - internal_network

  frontend:
    build:
      context: ./frontend
    container_name: bambase_frontend
    environment:
      TZ: Europe/Berlin
      DATABASE_URL: postgresql://backend:backend@frontend_db:5432/backend?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${FRONTEND_URL}
    restart: unless-stopped
    depends_on:
      frontend-migrate:
        condition: service_completed_successfully
    networks:
      - proxy
      - internal_network

volumes:
  frontend_db_data:

networks:
  internal_network:
    name: internal_network
  proxy:
    name: proxy
    external: true
